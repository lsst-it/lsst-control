---
profile::core::yum::versionlock:
  puppet-agent:
    ensure: "present"
    version: "%{lookup('puppet_agent::package_version')}"
    release: "1.el7"
    before: "Package[puppet-agent]"
sssd::main_config:
  pam:
    pam_response_filter:
      - "ENV:KRB5CCNAME:sudo-i"
yum::managed_repos:
  - "extras"
yum::repos:
  extras:  # provides container-selinux
    enabled: true
