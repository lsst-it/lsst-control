---
# canary scope for the s3nd endpoint watchdog (IT-6942): only the lsstcam dc
# nodes for now. to roll out to all cp s3nd nodes, move the two keys below to
# site/cp.yaml and drop the hosts::entries pins from role/{auxtel-fp,
# comcam-fp,ccs-dc}.yaml and node/{auxtel,comcam}-fp01.cp.lsst.org.yaml.
#
# sdfembs3.sdf.slac.stanford.edu is not resolvable outside slac and is pinned
# in /etc/hosts. the watchdog health checks the pinned receiver and fails
# over to a healthy alternate, restarting the s3nd instances which target it
# (see the 2026-05-09 incident: a single receiver served 503s for 36h).
# 172.24.7.249 is listed first so the historical pin is kept until the
# watchdog has a reason to move.
s3nd::watchdog:
  endpoint_hostname: "sdfembs3.sdf.slac.stanford.edu"
  receivers:
    - "172.24.7.249"
    - "172.24.7.247"
    - "172.24.7.248"
    - "172.24.7.250"

# mask the static pin from role/ccs-dc.yaml: the watchdog declares the Host
# resource itself and a second declaration is a compile error.
hosts::entries: {}

files:
  "/data":
    ensure: "directory"
    mode: "0755"
    owner: 0
    group: 0
  "/data/ccs-ipa-data":
    ensure: "directory"
    mode: "0755"
    owner: &ccsipauser 72055
    group: *ccsipauser

## Note: node/lsstcam-dc02.cp should not have image-handling,
## and so specifically redefines services to be empty.
## If you want to add more services here, they will also need to be
## added to that node.
ccs_software::services:
  prod:
    - {name: "image-handling", user: "ccs-ipa", group: "ccs-ipa", workdir: "/home/ccs-ipa"}
