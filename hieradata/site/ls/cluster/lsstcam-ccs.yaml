---
ccs_site: "base"
ccs_sal::dds_interface: "lsstcam-mcm-dds.ls.lsst.org"

## base-teststand-alerts
ccs_software::service_email: "base-teststand-alerts-aaaaojwlqmczgqmavrwyopux5a@rubin-obs.slack.com"

ccs_software::installations:
  lsstcam-software-40.0.3:
    aliases:
      - "puppet-40.0.3"

ccs_monit::alert:
  - "base-teststand-alerts-aaaaojwlqmczgqmavrwyopux5a@rubin-obs.slack.com"

s3nd::instances:
  ls-lsstcam:
    image: "%{alias('s3nd_default_image_ls')}"
    port: 15571
    env:
      S3ND_ENDPOINT_URL: "https://s3.ls.lsst.org"
      S3ND_QUEUE_TIMEOUT: "20s"
      S3ND_UPLOAD_BWLIMIT: "1Gi"
      S3ND_UPLOAD_MAX_PARALLEL: "27"
      S3ND_UPLOAD_PARTSIZE: "100Mi"
      S3ND_UPLOAD_TIMEOUT: "15s"
      S3ND_UPLOAD_TRIES: "2"
  s3dfrgw-lsstcam:
    image: "%{alias('s3nd_default_image_ls')}"
    port: 15581
    env: &s3dfrgw
      S3ND_ENDPOINT_URL: "https://s3dfrgw.slac.stanford.edu"
      S3ND_QUEUE_TIMEOUT: "15s"
      S3ND_UPLOAD_BWLIMIT: "4Gi"
      S3ND_UPLOAD_MAX_PARALLEL: "27"
      S3ND_UPLOAD_PARTSIZE: "100Mi"
      S3ND_UPLOAD_TIMEOUT: "4s"
      S3ND_UPLOAD_TRIES: "3"
  s3dfrgw-lsstcam-test:
    image: "%{alias('s3nd_default_image_ls')}"
    port: 15591
    env:
      <<: *s3dfrgw
