---
classes:
  - "anaconda"
  - "mate"
  - "profile::core::common"
  - "profile::core::debugutils"
  - "profile::core::docker"
  - "profile::core::docker::prune"
  - "profile::core::ni_packages"
  - "profile::core::x2go"
  - "profile::ts::hexrot"
  - "profile::ts::nexusctio"
  - "profile::util::xfce"

packages:
  - "freeglut-devel"

files:
  /rubin:
    ensure: "directory"
    recurse: true
    owner: 73006  # saluser
    group: 73006
    mode: "0775"
    subscribe:
      - "Package[runHexEui]"
      - "Package[runRotEui]"

# / on hexrot.cp was formated with xfs fstype=0 (long, long, long ago) and is
# not compatible with overlayfs[2]
profile::core::docker::storage_driver: "devicemapper"
accounts::group_list:
  # this is duplicating the ipa gid as a local group
  &docker_name docker-%{facts.networking.hostname}:
    ensure: "present"
    gid: 70014
    forcelocal: true

profile::ts::hexrot::ts_config_mttcs_version: "v0.18.3-alpha.1"

anaconda::anaconda_version: "Anaconda3-2023.07-2"
anaconda::python_env_name: "py313"
anaconda::python_env_version: "3.13"
anaconda::conda_packages:
  numpy:
    channel: "conda-forge"
    version: "2.0.2"
  pyside6:
    channel: "conda-forge"
    version: "6.9.2"
  qasync:
    channel: "conda-forge"
    version: "0.28.0"
  qt6-charts:
    channel: "conda-forge"
    version: "6.9.2"
  ts-guitool:
    channel: "lsstts"
    version: "0.3.2"
  ts-hexgui:
    channel: "lsstts"
    version: "0.5.3"
  ts-hexrotcomm:
    channel: "lsstts"
    version: "1.3.6"
  ts-m2com:
    channel: "lsstts"
    version: "1.5.14"
  ts-m2gui:
    channel: "lsstts"
    version: "1.1.10"
  ts-mtdomecom:
    channel: "lsstts"
    version: "0.3.5"
  ts-mtdomegui:
    channel: "lsstts"
    version: "0.5.7"
  ts-rotgui:
    channel: "lsstts"
    version: "0.4.6"
  ts-salobj:
    channel: "lsstts"
    version: "8.2.6"
  ts-tcpip:
    channel: "lsstts"
    version: "2.2.2"
  ts-xml:
    channel: "lsstts"
    version: "24.2.1"
