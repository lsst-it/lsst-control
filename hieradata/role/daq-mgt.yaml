---
classes:
  - "daq::daqsdk"
  - "daq::rptsdk"
  - "daq::service::dsid"
  - "daq::service::rce"
  - "dhcp"
  - "profile::core::common"
  - "profile::core::debugutils"
  - "profile::core::nfsclient"
  - "profile::core::nfsserver"
  - "profile::daq::common"
  - "profile::daq::sysctl"
  - "profile::nfs::v2"

packages:
  - "ckermit"
  - "minicom"
  - "setserial"

# enable ntp server for DAQ
chrony::port: 123
chrony::queryhosts:
  - "192.168/16"
chrony::clientlog: true

daq::daqsdk::version: "R5-V13.16"
daq::rptsdk::version: "V3.5.3"

# dhcp for DAQ + clients
dhcp::authoritative: true
dhcp::interfaces:
  - "lsst-daq"
dhcp::bootp: true
dhcp::logfacility: "local7"
dhcp::pools:
  daq_clients:
    network: "192.168.100.0"
    mask: "255.255.255.0"
    range: "192.168.100.2 192.168.100.254"
    pool_parameters:
      - "ddns-update-style none"
      - "default-lease-time -1"
      - "max-lease-time -1"

accounts::user_list:
  rce: &daq_user
    uid: 62002
    gid: 62002
    managehome: true
    system: false
    managevim: false
    shell: "/sbin/nologin"
  dsid:
    <<: *daq_user
    uid: 62003
    gid: 62003

# SSH key and config for rce service account to connect to RCE embedded
# systems on the DAQ network (192.168.100.0/24).
# The .ssh directory is created by the accounts module (managehome: true).
# The private key content is in lsst-puppet-hiera-private/role/daq-mgt.eyaml.
files:
  "/home/rce/.ssh/config":
    ensure: "file"
    mode: "0644"
    owner: &rce_uid 62002
    group: *rce_uid
    backup: false
    show_diff: false
    content: |
      # Managed by Puppet - do not edit
      Host 192.168.100.*
          User root
          Port 22
          IdentityFile ~/.ssh/rce_rsa
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          LogLevel ERROR
          ForwardX11 no
          ForwardAgent no
          BatchMode yes
