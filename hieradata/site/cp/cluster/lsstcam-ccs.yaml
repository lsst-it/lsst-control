---
clustershell::groupmembers:
  aio: {group: "aio", member: "lsstcam-aio[01-02,05-06]"}
  all: {group: "all", member: "@aio,@dc,@dc-old,@hcu,@misc,@vw"}
  dc-old: {group: "dc-old", member: "lsstcam-dc[01-10]"}
  dc: {group: "dc", member: "lsstcam-dc[1-9,100]"}
  dc-new: {group: "dc-new", member: "@dc"}
  hcu: {group: "hcu", member: "@lion,@uno"}
  ## Unclear is this should include "lsstcam-turbotest", which is a lion,
  ## but not really part of lsstcam.
  lion: {group: "lion", member: "@quadbox,lsstcam-fb[01-03],lsstcam-shutter[01-02]"}
  misc: {group: "misc", member: "lsstcam-db[01-02],lsstcam-mcm,lsstcam-mcm1,lsstcam-vs01,lsstcam-vs1"}
  moxa: {group: "moxa", member: "lsstcam-moxa[1-2]"}
  quadbox: {group: "quadbox", member: "lsstcam-fcs,lsstcam-quad,lsstcam-rebps,lsstcam-vac"}
  uno: {group: "uno", member: "lsstcam-ccobtb,lsstcam-ccobwb,lsstcam-pcs[01-02],lsstcam-ser"}
  vw: {group: "vw", member: "lsstcam-vw[01-04]"}

profile::ccs::monitoring::mrtg: true

profile::ccs::tomcat::rest_url: "lsstcam-db02:3306/ccsdbprod"

s3nd::instances:
  cp-lsstcam:
    image: "%{alias('s3nd_default_image_cp')}"
    port: 15571
    env:
      S3ND_ENDPOINT_URL: "https://s3.cp.lsst.org"
      S3ND_QUEUE_TIMEOUT: "15s"
      S3ND_UPLOAD_MAX_PARALLEL: "27"
      S3ND_UPLOAD_PARTSIZE: "100Mi"
      S3ND_UPLOAD_TIMEOUT: "3s"
      S3ND_UPLOAD_TRIES: "5"
  sdfembs3-lsstcam:
    image: "%{alias('s3nd_default_image_cp')}"
    port: 15581
    env: &sdfembss3nd
      S3ND_ENDPOINT_URL: "https://sdfembs3.sdf.slac.stanford.edu"
      S3ND_QUEUE_TIMEOUT: "15s"
      S3ND_UPLOAD_BWLIMIT: "4Gi"
      S3ND_UPLOAD_MAX_PARALLEL: "27"
      S3ND_UPLOAD_PARTSIZE: "100Mi"
      S3ND_UPLOAD_TIMEOUT: "4s"
      S3ND_UPLOAD_TRIES: "3"
  sdfembs3-lsstcam-test:
    image: "%{alias('s3nd_default_image_cp')}"
    port: 15591
    env:
      <<: *sdfembss3nd
